# SonarCloud, which analyses this repository automatically. The settings live
# here rather than in the project's web interface for the same reason
# phpstan.neon and infection.json5 do: a gate nobody can read in the repository
# is a gate nobody reviews.
sonar.projectKey=kristos80_mule
sonar.organization=kristos80

# Production code, test code, and the workflow — told apart, because Sonar
# applies a different and more useful rule set to tests, and because the
# GitHub Actions rules have real things to say about release.yml.
sonar.sources=src,bin,.github
sonar.tests=tests

# Coverage, which is the whole reason this project is analysed from CI rather
# than automatically: automatic analysis never runs the suite, so it cannot
# produce a coverage measure for any language. The scanner job in release.yml
# writes this file immediately before scanning.
sonar.php.coverage.reportPaths=coverage.xml

# The external layer is excluded from coverage in phpunit.xml and from mutation
# in infection.json5, so Sonar has to be told as well or it reports a repository
# whose own gate is 100 % as something lower. A directory pattern rather than a
# third enumerated copy of those five file names: two lists that must stay in
# step are already one more than ideal.
sonar.coverage.exclusions=src/External/**

# The rules below are not active in "Sonar way core", which is the built-in
# profile this project is on, so today this block changes nothing — and it was
# never read at all while analysis was automatic, since that mode ignores
# sonar.issue.ignore.*. It stays because a scanner honours it and because the
# profile is not ours to depend on: if the project is ever moved to the full
# "Sonar way", this is what keeps the answer the same, with the reasons
# attached rather than living as toggles in a web interface.
sonar.issue.ignore.multicriteria=tabs,constants,returns,requireOnce,fakeSize

# php:S105 — "replace all tab characters". Tabs are the indentation of this
# project and of every other one in this account; the rule is a style vote, and
# this repository has already voted.
sonar.issue.ignore.multicriteria.tabs.ruleKey=php:S105
sonar.issue.ignore.multicriteria.tabs.resourceKey=**/*

# php:S1781 — "write this TRUE constant in lower case". Same: uppercase
# TRUE/FALSE/NULL is deliberate and consistent here.
sonar.issue.ignore.multicriteria.constants.ruleKey=php:S1781
sonar.issue.ignore.multicriteria.constants.resourceKey=**/*

# php:S1142 — "more than 3 returns". The blueprint this project follows gates
# cognitive complexity instead (9 per method, 40 per class, enforced by
# phpstan.neon) and deliberately scores an early return as free, because a
# guard that returns is what keeps the rest of a method unnested. Counting
# returns rewards the opposite shape.
sonar.issue.ignore.multicriteria.returns.ruleKey=php:S1142
sonar.issue.ignore.multicriteria.returns.resourceKey=**/*

# php:S2003 — "replace require with require_once". Measured, not assumed:
# Composer's autoload.php is built to be required repeatedly and hand back the
# same memoised ClassLoader, which is the mechanism bin/mule relies on to pick
# up the project's loader after its own. By the time this test runs, PHPUnit's
# bootstrap has already included that file, so require_once would return TRUE
# instead of the loader and three tests would fail. The rule's only "bug"
# finding in this repository would introduce one.
sonar.issue.ignore.multicriteria.requireOnce.ruleKey=php:S2003
sonar.issue.ignore.multicriteria.requireOnce.resourceKey=tests/Integration/ExternalTest.php

# php:S1448 — "too many methods". InMemoryFilesystem is a test double for a
# filesystem port of fourteen methods, plus the handful of seeding helpers a
# test needs to state what is on disk. Splitting a fake to match a rule would
# make the thing it fakes harder to read.
sonar.issue.ignore.multicriteria.fakeSize.ruleKey=php:S1448
sonar.issue.ignore.multicriteria.fakeSize.resourceKey=tests/**/*
