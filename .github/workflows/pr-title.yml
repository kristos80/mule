# Validates that a pull request's title is a Conventional Commits subject.
#
# Why this is load-bearing rather than tidiness: master allows only squash
# merges and takes the commit subject from the pull request's title, so **the
# title becomes the commit subject on master** — and that subject is the only
# thing semantic-release reads to decide the next version. A title that is not
# conventional fails nothing. It silently produces no release, which is the
# hardest kind of problem to notice.
#
# The second job guards the *description* for the same reason. A squash commit
# takes its body from the pull request description — `squash_merge_commit_message`
# is PR_BODY — and GitHub honours a CI skip directive anywhere in a commit
# message. So a description that merely *mentions* one skips the whole run on
# merge: no gates on the merge commit, and no release. Measured rather than
# imagined, on the pull request that moved the release off a direct push: its
# description explained the directive it was removing, and the post-merge run
# recorded zero checks.
#
# `edited` is in the trigger on purpose: retitling or rewording has to re-run
# these, or a title fixed after a red check stays red and one broken after a
# green check stays green.
name: PR

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  lint:
    name: Validate PR title
    runs-on: ubuntu-latest

    steps:
      - uses: amannn/action-semantic-pull-request@66e72920af32222769c386d81f89656ebcb6d6d5 # v6.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Of these, only `feat` and `fix` release anything — `!` or a
          # BREAKING CHANGE footer makes it major. The other five are valid
          # subjects that deliberately ship nothing, which is why this checks
          # the *format* and never "will this release".
          #
          # `perf` and `revert` are deliberately absent. Both *would* release a
          # patch under semantic-release's defaults, so admitting either is a
          # decision about what this repository releases rather than an
          # addition to a list.
          types: |
            feat
            fix
            refactor
            docs
            test
            chore
            ci

  skips:
    name: Refuse CI skip directives
    runs-on: ubuntu-latest

    steps:
      # The description is fetched rather than interpolated. Passing it through
      # `env:` would be safe too — that is GitHub's own hardening advice, and
      # unsafe is only ever `${{ }}` inside a `run:` line — but a workflow
      # expression carrying untrusted data is a pattern a scanner cannot tell
      # apart from the unsafe one, and it earned a security finding here. Asking
      # the API keeps the data out of the template altogether, which costs
      # nothing and leaves nothing to argue about.
      - name: Check the description
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          BODY="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"

          # GitHub's five, case-insensitive, with a hyphen tolerated where it
          # takes a space. Matching more than GitHub honours is the safe
          # direction to be wrong in.
          if printf '%s' "$BODY" | grep -qiE '\[(skip[ -]ci|ci[ -]skip|no[ -]ci|skip[ -]actions|actions[ -]skip)\]'; then
            echo "::error::This description carries a CI skip directive. A squash commit takes its body from the description, so merging would skip the gates and the release. Write the directive without its brackets, or in a code block that does not reproduce it verbatim."
            exit 1
          fi

          echo "No skip directive in the description."
