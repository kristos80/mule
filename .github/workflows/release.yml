name: Release

on:
  push:
    branches:
      - master
      # The rewrite's prerelease channel. semantic-release publishes
      # 5.0.0-next.N from here (see .releaserc.json), so the new pipeline is
      # exercised by a real consumer while master stays on v4 — rather than
      # landing as one unvalidated merge. Remove this branch, and its entry in
      # .releaserc.json, once v5 is on master.
      - v5
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    name: Gates on PHP ${{ matrix.php }}

    # 8.5 is advisory, for the same reason Sonar is advisory in kristos80/hook:
    # mule declares php ^8.4, so consumers may well run 8.5 and the leg is worth
    # having — but no lock file is committed, so a dev dependency that starts
    # emitting a deprecation on the newer runtime would turn this red with no
    # commit of ours, and that must not hold up a release. 8.4 blocks.
    continue-on-error: ${{ matrix.php == '8.5' }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov
          tools: composer:v2

      - run: composer install --no-interaction --no-progress

      - name: Static analysis
        run: composer analyse

      # One run, with the driver attached, producing every artifact anything
      # downstream needs. Running `composer test` and then the same suite again
      # for coverage measured nothing the first pass had not, and paid for every
      # test twice on both legs.
      #
      # The XML coverage and the JUnit log are for the mutation gate below, which
      # is handed this report rather than generating its own — see M1 in
      # docs/keying.md. That is also the shape mule itself drives Infection in,
      # so the gate exercises the mechanic the tool depends on.
      - name: Unit suite, with coverage
        run: >
          ./vendor/bin/phpunit
          --coverage-text
          --coverage-xml=.cov/coverage-xml
          --log-junit=.cov/junit.xml
          --exclude-source-from-xml-coverage

      # The external layer against the real thing. Those two wrappers are the
      # only code excluded from the unit suite's coverage and from the mutation
      # gate, on the grounds that there is no decision in them to assert — which
      # is an argument for not unit testing them, not for never running them.
      #
      # Its own configuration because it produces no coverage by design:
      # measuring it here would report a different line set than the gate does.
      - name: Integration suite
        run: composer test:integration

      # **The differential, and it is the point of the whole design.** mule's
      # pipeline is driven end to end over a fixture project, and compared
      # against what Infection produces from PHPUnit's own report — at mutant
      # identity, not at MSI.
      #
      # Aggregates cannot see the failure this exists for: when merging shard
      # JUnits silently skipped 40 of 1,174 mutants on a real project, both runs
      # still reported exactly 1,174 and MSI moved 95.32 -> 95.15. One of its
      # four cases puts that defect back and asserts the comparison goes red, so
      # a green differential means something.
      #
      # Not `composer test:differential`: that wraps the local coverage driver,
      # and here pcov is already on from the setup step.
      - name: Differential
        run: ./vendor/bin/phpunit --configuration=phpunit.differential.xml

      # **Plain Infection, not mule on itself.** mule used to gate itself —
      # `new` on a pull request, `full` on master — and that is deliberately
      # not what happens here any more.
      #
      # Measured, on this repository: ~29 source files, each test executing
      # about five of them, which is 17 % of the project per test. A file's
      # closure is therefore the whole project, and a comment-only edit marks
      # 29 of 36 files stale. The cache is sound and saves nothing.
      #
      # That is a property of the project's size, not of its tests — the
      # application mule was written for has the same per-test footprint and
      # invalidates 2.7 % per edit. See docs/keying.md §2 and §8. A 3-second
      # gate has nothing to gain from a cache, so self-hosting here would add a
      # failure mode and buy no time.
      #
      # **The flags are not optional**, and docs/keying.md records why for each:
      # `--with-timeouts` because a timed-out mutant otherwise scores as a kill
      # (M14), and both MSI floors because a zero-mutant run exits 0 without
      # them. `--ignore-msi-with-no-mutations` must never appear here (G5).
      - name: Mutation gate, gated at MSI 100 %
        if: matrix.php == '8.4'
        run: >
          ./vendor/bin/infection
          --coverage=.cov
          --skip-initial-tests
          --threads=max
          --with-timeouts
          --min-msi=100
          --min-covered-msi=100
          --no-progress
          -n

  sonar:
    runs-on: ubuntu-latest

    name: Sonar

    # Advisory, and deliberately not something `release` depends on. Sonar is a
    # second opinion on top of the gates, and kristos80/hook records what it
    # costs to treat it as more than that: an expired SONAR_TOKEN returned 403
    # before a single file was analysed and blocked a release whose own gates
    # were all green.
    continue-on-error: true

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Sonar reads history to work out what counts as new code.
          fetch-depth: 0

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          coverage: pcov
          tools: composer:v2

      - run: composer install --no-interaction --no-progress

      # The unit suite, which is the same run the coverage gate measures and
      # the same one mule keys itself from. The integration suite produces no
      # coverage by design.
      - name: Coverage for Sonar
        run: ./vendor/bin/phpunit --coverage-clover=coverage.xml

      - name: Scan
        uses: SonarSource/sonarqube-scan-action@70bad232163b09d998ea0707ee80c0ec80798c16 # v8.5.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  release:
    runs-on: ubuntu-latest
    needs: gates

    # Merging the release PR is itself a push to master, so without the subject
    # guard the run would start again on its own output. `[skip ci]` used to do
    # this when the bump was pushed straight here; a PR's squash commit carries
    # the title verbatim instead, which is what this switches on.
    # master cuts releases; v5 cuts prereleases (5.0.0-next.N). The branch
    # list here and the one in .releaserc.json have to agree — semantic-release
    # refuses to publish from a branch it does not know, and a branch this job
    # runs on but semantic-release does not is a silent no-op.
    if: >-
      github.event_name == 'push'
      && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/v5')
      && !startsWith(github.event.head_commit.message, 'chore(release):')

    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Reads the conventional commits since the last tag, decides the version,
      # writes CHANGELOG.md, tags, and publishes the GitHub release. Packagist
      # picks the tag up through its GitHub integration; nothing here talks to
      # it directly.
      #
      # The tag and the release are published from here; the changelog is not.
      # `@semantic-release/git` would have pushed it straight to master, which
      # the branch ruleset rejects twice over — a pull request is required, and
      # a runner's unsigned commit would fail `required_signatures` on top of
      # that. A tag is not a branch, so publishing one needs no exception.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      # A `ci:`/`chore:`/`docs:`/`refactor:`/`test:` merge is no release at all:
      # semantic-release prepares nothing and the tree stays clean. Said out
      # loud rather than left for create-pull-request to no-op silently.
      #
      # The version comes from the tag semantic-release has just pushed, which
      # is the source of truth it computes from. composer.json carries no
      # version field on purpose, and this repository's package.json is a
      # holder for the release tooling rather than something the release writes.
      - name: Did a release happen?
        id: prepared
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain)" ]; then
            echo "No release was prepared for this push. Nothing to open."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --tags --quiet
          echo "version=$(git describe --tags --abbrev=0 | sed 's/^v//')" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git status --porcelain

      # The changelog arrives the way every other change to master does.
      #
      # `sign-commits` commits through the GitHub API, so the branch commit is
      # verified rather than showing as unsigned. That is hygiene and not what
      # makes the PR mergeable: what lands on master is GitHub's own squash
      # commit, signed with the web-flow key, which is why `required_signatures`
      # is satisfied without anybody configuring a key locally.
      # **master only.** This opens a PR into master, so running it from v5
      # would aim a prerelease's changelog at the released branch. Prereleases
      # get their notes from the GitHub release and nothing else; CHANGELOG.md
      # is written once, when v5 lands on master and cuts the real 5.0.0.
      - name: Open the release pull request
        id: opened
        if: steps.prepared.outputs.changed == 'true' && github.ref == 'refs/heads/master'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          sign-commits: true
          token: ${{ secrets.GITHUB_TOKEN }}
          base: master
          branch: chore/release-${{ steps.prepared.outputs.version }}
          delete-branch: true
          # Both strings are the bare subject, and the title is the one that
          # matters: `squash_merge_commit_title` is PR_TITLE, so this lands on
          # master verbatim and is what the guard above switches on.
          title: "chore(release): ${{ steps.prepared.outputs.version }}"
          commit-message: "chore(release): ${{ steps.prepared.outputs.version }}"
          labels: release
          add-paths: CHANGELOG.md
          body: |
            Changelog for **v${{ steps.prepared.outputs.version }}**, prepared by `semantic-release`.

            The git tag and the GitHub release are already published — this PR carries only
            the file `@semantic-release/git` would have pushed straight to `master`, which
            the branch ruleset rejects: a pull request is required, and a runner's unsigned
            push would fail `required_signatures` regardless.

            So a tag's tree does not contain its own changelog entry. Accepted: the tag
            marks the released commit, and Packagist reads the version from the tag.

            Merging this triggers no further release — the squash commit's subject starts
            with `chore(release):`, which the `release` job skips.

      # `--delete-branch` rather than the repository's own `delete_branch_on_merge`:
      # that setting is on and did not fire, because the merge is performed by
      # the Actions app rather than by a person, and the branch outlived its own
      # release. Asking for it here does not depend on which actor merges.
      #
      # The one thing that lands on master without a human reading it, and it is
      # a changelog the release already published. GitHub merges it when the
      # gates go green, so the ruleset still decides — nothing is bypassed, the
      # waiting is just nobody's job. Left unmerged it is harmless and ignored:
      # the tag and the GitHub release are out, and Packagist reads the tag.
      - name: Let it merge itself once the gates are green
        if: steps.opened.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.opened.outputs.pull-request-number }}
        run: gh pr merge --auto --squash --delete-branch "$PR" --repo "$GITHUB_REPOSITORY"
