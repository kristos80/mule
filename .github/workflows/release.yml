name: Release

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    name: Gates on PHP ${{ matrix.php }}

    # 8.5 is advisory, for the same reason Sonar is advisory in kristos80/hook:
    # mule declares php ^8.4, so consumers may well run 8.5 and the leg is worth
    # having — but no lock file is committed, so a dev dependency that starts
    # emitting a deprecation on the newer runtime would turn this red with no
    # commit of ours, and that must not hold up a release. 8.4 blocks.
    continue-on-error: ${{ matrix.php == '8.5' }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov
          tools: composer:v2

      - run: composer install --no-interaction --no-progress

      - name: Static analysis
        run: composer analyse

      # One run, with the driver attached. Running `composer test` and then the
      # same suite again for coverage measured nothing the first pass had not,
      # and paid for every test twice on both legs.
      - name: Unit suite, with coverage
        run: ./vendor/bin/phpunit --coverage-text

      - name: Integration suite
        run: composer test:integration

      # Nothing is removed first any more: mule.json holds only what defines
      # the gate, and it is byte-identical on every machine. Enabling a
      # coverage driver is done to the environment rather than written down,
      # which here is the pcov the setup step turned on.
      #
      # One leg only: a mutation score is a property of the code and its tests,
      # not of the runtime, and the committed store is keyed on file digests
      # that no PHP version changes. Running it twice would prove nothing twice
      # and could write two stores.
      # `new` on a pull request and `full` on master, which is this tool used on
      # itself rather than around itself.
      #
      # **Both are audited by the same diff**, and that is what makes `new`
      # enough here. The store is committed, so a current one leaves `new` with
      # nothing to mutate and nothing to write; a stale one is mutated, banked,
      # and the diff below fails. So a pull request still cannot land a store
      # that does not describe its own tree, and it pays seconds rather than
      # every mutant to prove it.
      #
      # **`full` stays where it earns its cost.** Only a whole-project run can
      # catch a store that claims *more* than was proven — `new` trusts what it
      # is told — and master is where a release is cut from, so that is where
      # the claim has to be true.
      - name: Mutation gate, gated at MSI 100 %
        if: matrix.php == '8.4'
        env:
          VERB: ${{ github.event_name == 'pull_request' && 'new' || 'full' }}
        run: php bin/mule "$VERB"

      # If that run banked anything, the committed store did not already say it.
      - name: The committed store was already complete
        if: matrix.php == '8.4'
        run: git diff --exit-code .mule/verified.json

  sonar:
    runs-on: ubuntu-latest

    name: Sonar

    # Advisory, and deliberately not something `release` depends on. Sonar is a
    # second opinion on top of the gates, and kristos80/hook records what it
    # costs to treat it as more than that: an expired SONAR_TOKEN returned 403
    # before a single file was analysed and blocked a release whose own gates
    # were all green.
    continue-on-error: true

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Sonar reads history to work out what counts as new code.
          fetch-depth: 0

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          coverage: pcov
          tools: composer:v2

      - run: composer install --no-interaction --no-progress

      # The unit suite, which is the same run the coverage gate measures and
      # the same one mule keys itself from. The integration suite produces no
      # coverage by design.
      - name: Coverage for Sonar
        run: ./vendor/bin/phpunit --coverage-clover=coverage.xml

      - name: Scan
        uses: SonarSource/sonarqube-scan-action@70bad232163b09d998ea0707ee80c0ec80798c16 # v8.5.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  release:
    runs-on: ubuntu-latest
    needs: gates

    # Merging the release PR is itself a push to master, so without the subject
    # guard the run would start again on its own output. `[skip ci]` used to do
    # this when the bump was pushed straight here; a PR's squash commit carries
    # the title verbatim instead, which is what this switches on.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/master'
      && !startsWith(github.event.head_commit.message, 'chore(release):')

    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Reads the conventional commits since the last tag, decides the version,
      # writes CHANGELOG.md, tags, and publishes the GitHub release. Packagist
      # picks the tag up through its GitHub integration; nothing here talks to
      # it directly.
      #
      # The tag and the release are published from here; the changelog is not.
      # `@semantic-release/git` would have pushed it straight to master, which
      # the branch ruleset rejects twice over — a pull request is required, and
      # a runner's unsigned commit would fail `required_signatures` on top of
      # that. A tag is not a branch, so publishing one needs no exception.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      # A `ci:`/`chore:`/`docs:`/`refactor:`/`test:` merge is no release at all:
      # semantic-release prepares nothing and the tree stays clean. Said out
      # loud rather than left for create-pull-request to no-op silently.
      #
      # The version comes from the tag semantic-release has just pushed, which
      # is the source of truth it computes from. composer.json carries no
      # version field on purpose, and this repository's package.json is a
      # holder for the release tooling rather than something the release writes.
      - name: Did a release happen?
        id: prepared
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain)" ]; then
            echo "No release was prepared for this push. Nothing to open."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --tags --quiet
          echo "version=$(git describe --tags --abbrev=0 | sed 's/^v//')" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git status --porcelain

      # The changelog arrives the way every other change to master does.
      #
      # `sign-commits` commits through the GitHub API, so the branch commit is
      # verified rather than showing as unsigned. That is hygiene and not what
      # makes the PR mergeable: what lands on master is GitHub's own squash
      # commit, signed with the web-flow key, which is why `required_signatures`
      # is satisfied without anybody configuring a key locally.
      - name: Open the release pull request
        id: opened
        if: steps.prepared.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          sign-commits: true
          token: ${{ secrets.GITHUB_TOKEN }}
          base: master
          branch: chore/release-${{ steps.prepared.outputs.version }}
          delete-branch: true
          # Both strings are the bare subject, and the title is the one that
          # matters: `squash_merge_commit_title` is PR_TITLE, so this lands on
          # master verbatim and is what the guard above switches on.
          title: "chore(release): ${{ steps.prepared.outputs.version }}"
          commit-message: "chore(release): ${{ steps.prepared.outputs.version }}"
          labels: release
          add-paths: CHANGELOG.md
          body: |
            Changelog for **v${{ steps.prepared.outputs.version }}**, prepared by `semantic-release`.

            The git tag and the GitHub release are already published — this PR carries only
            the file `@semantic-release/git` would have pushed straight to `master`, which
            the branch ruleset rejects: a pull request is required, and a runner's unsigned
            push would fail `required_signatures` regardless.

            So a tag's tree does not contain its own changelog entry. Accepted: the tag
            marks the released commit, and Packagist reads the version from the tag.

            Merging this triggers no further release — the squash commit's subject starts
            with `chore(release):`, which the `release` job skips.

      # The one thing that lands on master without a human reading it, and it is
      # a changelog the release already published. GitHub merges it when the
      # gates go green, so the ruleset still decides — nothing is bypassed, the
      # waiting is just nobody's job. Left unmerged it is harmless and ignored:
      # the tag and the GitHub release are out, and Packagist reads the tag.
      - name: Let it merge itself once the gates are green
        if: steps.opened.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.opened.outputs.pull-request-number }}
        run: gh pr merge --auto --squash "$PR" --repo "$GITHUB_REPOSITORY"
